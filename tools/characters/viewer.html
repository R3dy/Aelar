<!doctype html><html><head><style>html,body{margin:0;background:#8fa9b8;overflow:hidden}</style>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q=new URLSearchParams(location.search);
const r=new THREE.WebGLRenderer({antialias:true}); r.setSize(innerWidth,innerHeight); r.outputColorSpace=THREE.SRGBColorSpace;

const h=+q.get('h')||1.9; const zm=+q.get('zoom')||1; const ty=+q.get('ty')||h*0.48; cam.position.set(0,ty+h*0.07,h*2.55/zm); cam.lookAt(0,ty,0);
