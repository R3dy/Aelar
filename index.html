<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Training Grounds</title>
<style>
@font-face { font-family: 'Fira Sans'; font-weight: 600; font-display: swap; src: url(assets/fonts/fira-sans-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: 'Fira Sans'; font-weight: 700; font-display: swap; src: url(assets/fonts/fira-sans-latin-700-normal.woff2) format('woff2'); }
:root { --s: 1; --bg: #000; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: #fff; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  font-family: 'Fira Sans', -apple-system, 'Segoe UI', Roboto, sans-serif; }
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#hud { position: fixed; inset: 0; pointer-events: none; }
#hud .p { position: absolute; transform-origin: 0 0; }
#hud img { display: block; width: 100%; height: 100%; -webkit-user-drag: none; }
#hud .btn { pointer-events: auto; cursor: pointer; }
#hud .btn:active, #hud .btn.pressed { filter: brightness(1.35); }
.t { position: absolute; white-space: nowrap; font-weight: 600; color: #fff;
  text-shadow: 0 0 2px #000, 0 0 2px #000, 1px 1px 1px #000, -1px -1px 1px #000, 1px -1px 1px #000, -1px 1px 1px #000; line-height: 1; }
.cd { position: absolute; inset: 0; border-radius: 6%; pointer-events: none; }
.cdn { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; }
.dim { filter: grayscale(0.8) brightness(0.55); }
.qline.done .qt { color: #c9f27a; }
.check { position: absolute; color: #ffd24a; font-weight: 700; display: none; text-shadow: 0 0 3px #000, 0 0 2px #000; }
.qline.done .check { display: block; }
#dialog { position: fixed; left: 50%; transform: translateX(-50%); width: min(78vw, 720px); pointer-events: auto; display: none;
  background: linear-gradient(180deg, rgba(20,16,12,.92), rgba(30,22,14,.94)); border: 2px solid #c9a24a; border-radius: 10px;
  box-shadow: 0 0 0 2px rgba(0,0,0,.6), 0 8px 30px rgba(0,0,0,.6); padding: 14px 18px 12px; }
#dialog .who { color: #ffd84a; font-weight: 700; margin-bottom: 6px; }
#dialog .txt { line-height: 1.35; color: #f4ece0; }
#dialog .more { text-align: right; color: #c9a24a; font-size: .8em; margin-top: 6px; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); padding: 8px 22px; display: none; pointer-events: none;
  background: linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,.7) 20%, rgba(0,0,0,.7) 80%, rgba(0,0,0,0));
  color: #ffd84a; font-weight: 700; text-shadow: 0 0 6px rgba(255,170,0,.6), 0 0 2px #000; white-space: nowrap; }
.dmg { position: absolute; font-weight: 700; color: #ffe08a; pointer-events: none; text-shadow: 0 0 3px #000, 0 0 2px #000; white-space: nowrap; }
.talk { position: absolute; pointer-events: auto; padding: .35em 1em; border-radius: 1em; background: rgba(20,16,12,.85); border: 2px solid #c9a24a; color: #ffd84a; font-weight: 700; display: none; transform: translate(-50%, 0); }
#rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px; background: #101418; color: #e8dcc0; text-align: center; font-size: 18px; z-index: 10; padding: 24px; }
#rotate .ph { width: 54px; height: 92px; border: 3px solid #c9a24a; border-radius: 10px; animation: rot 2.2s ease-in-out infinite; }
@keyframes rot { 0%, 20% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
#loading { position: fixed; inset: 0; background: #0d1014; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; color: #e8dcc0; z-index: 20; transition: opacity .6s; }
#loading .bar { width: 220px; height: 6px; background: #2a2a2a; border-radius: 3px; overflow: hidden; }
#loading .bar div { height: 100%; width: 0; background: linear-gradient(90deg, #c9a24a, #ffd84a); transition: width .2s; }
#fin { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px; background: rgba(0,0,0,.55); z-index: 5; pointer-events: auto; text-align: center; }
#fin h2 { margin: 0; color: #ffd84a; text-shadow: 0 0 10px rgba(255,170,0,.6); }
#fin button { font: inherit; font-weight: 700; padding: 10px 26px; border-radius: 22px; border: 2px solid #c9a24a; background: #2a1f14; color: #ffd84a; }
#hud .xpbar { background: rgba(10,8,4,.75); border: 1px solid rgba(201,162,74,.8); border-radius: 4px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.6); }
#hud .xpbar .fill { height: 100%; width: 0; background: linear-gradient(90deg, #b07a18, #ffd84a); transition: width .6s cubic-bezier(.2,.8,.2,1); }
#hud .xpbar.glow { animation: xpglow .9s ease-out; }
@keyframes xpglow { 0% { box-shadow: 0 0 14px 4px rgba(255,210,80,.95); } 100% { box-shadow: 0 0 0 1px rgba(0,0,0,.6); } }
.xptext { color: #f0d890; }
.xppop { color: #ffe27a; animation: xppop 1.6s ease-out forwards; text-shadow: 0 0 8px rgba(255,180,0,.8), 0 0 2px #000; }
@keyframes xppop { 0% { opacity: 0; transform: translate(0, 6px) scale(.8); } 15% { opacity: 1; transform: translate(0, 0) scale(1.15); } 30% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(0, -18px); } }
.dmg.crit { color: #ffcf3a; text-shadow: 0 0 10px rgba(255,120,0,.9), 0 0 3px #000, 0 0 2px #000; }
#stick { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 2px solid rgba(255,220,140,.55); background: radial-gradient(rgba(0,0,0,.05), rgba(0,0,0,.28)); display: none; pointer-events: none; }
#stick div { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, rgba(255,240,200,.85), rgba(201,162,74,.65)); box-shadow: 0 0 8px rgba(0,0,0,.5); transform: translate(-50%,-50%); }
#objmark { position: fixed; display: none; pointer-events: none; transform: translate(-50%, -100%); text-align: center; }
#objmark .g { color: #ffd84a; font-size: 1.5em; line-height: 1; text-shadow: 0 0 10px rgba(255,170,0,.9), 0 0 2px #000; animation: bob 1.4s ease-in-out infinite; }
#objmark .d { font-weight: 700; font-size: .7em; color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
#banner { position: fixed; left: 50%; top: 24%; white-space: nowrap; transform: translate(-50%, 0); text-align: center; pointer-events: none; opacity: 0; }
#banner .k { color: #e8c870; font-weight: 600; font-size: clamp(12px, 2.2vh, 20px); letter-spacing: .3em; text-transform: uppercase; text-shadow: 0 0 3px #000; }
#banner .n { color: #ffe9a8; font-weight: 700; font-size: clamp(22px, 5.4vh, 48px); text-shadow: 0 0 14px rgba(255,160,0,.7), 0 0 3px #000, 0 0 2px #000; }
#banner .ln { height: 2px; margin: 6px auto 0; width: 70%; background: linear-gradient(90deg, transparent, #e8c870, transparent); }
#banner.show { animation: banner 3.2s ease-out forwards; }
@keyframes banner { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.96); } 12% { opacity: 1; transform: translate(-50%, 0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<div id="dialog"><div class="who"></div><div class="txt"></div><div class="more">Tap to continue ▸</div></div>
<div id="toast"></div>
<div id="banner"><div class="k">New quest</div><div class="n"></div><div class="ln"></div></div>
<div id="objmark"><div class="g">◆</div><div class="d"></div></div>
<div id="stick"><div></div></div>
<div id="fin"><h2>Training complete</h2><div>You have reached the end of the Training Grounds prototype.</div><button id="again">Play again</button></div>
<div id="rotate"><div class="ph"></div><div>Turn your phone sideways to play</div></div>
<div id="loading"><div>Training Grounds</div><div class="bar"><div></div></div></div>
<script src="game.js"></script>
</body>
</html>
